services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    gpus:
      - driver: nvidia
        count: all
        capabilities:
          - gpu
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TF_FORCE_GPU_ALLOW_GROWTH: "true"
